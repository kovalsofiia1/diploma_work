<app-header></app-header>
<ion-content [fullscreen]="true" class="profile">
  <section class="hero" aria-label="Профіль">
    <div class="hero__inner">
      <div class="hero__top">
        <div class="avatar" aria-hidden="true">
          <ion-icon name="person-outline"></ion-icon>
        </div>

        <div class="who">
          <div class="who__name">{{ displayName }}</div>
          <div class="who__email">{{ user?.email || '—' }}</div>
        </div>

        <button type="button" class="logout" (click)="logout()" aria-label="Вийти">
          <ion-icon name="log-out-outline"></ion-icon>
        </button>
      </div>

      <div class="stats" aria-label="Статистика">
        <div class="stat">
          <div class="stat__value">{{ attendedCount }}</div>
          <div class="stat__label">Відвідано</div>
        </div>
        <div class="stat">
          <div class="stat__value">{{ purchasedCount }}</div>
          <div class="stat__label">Квитків</div>
        </div>
        <div class="stat">
          <div class="stat__value">{{ createdCount }}</div>
          <div class="stat__label">Створено</div>
        </div>
      </div>
    </div>
  </section>

  <div class="sheet">
    <div class="container">
      <div class="panel">
        <button type="button" class="row" (click)="openTickets()">
          <span class="row__icon row__icon--tickets" aria-hidden="true">
            <ion-icon name="ticket-outline"></ion-icon>
          </span>
          <span class="row__main">
            <span class="row__title">Мої квитки</span>
            <span class="row__sub">Переглянути куплені квитки</span>
          </span>
          <ion-icon class="row__chev" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
        </button>

        <button type="button" class="row" (click)="openFavorites()">
          <span class="row__icon row__icon--fav" aria-hidden="true">
            <ion-icon name="heart-outline"></ion-icon>
          </span>
          <span class="row__main">
            <span class="row__title">Улюблені</span>
            <span class="row__sub">Збережені події</span>
          </span>
          <ion-icon class="row__chev" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
        </button>

        <button type="button" class="row" (click)="openMyEvents()">
          <span class="row__icon row__icon--events" aria-hidden="true">
            <ion-icon name="calendar-outline"></ion-icon>
          </span>
          <span class="row__main">
            <span class="row__title">Мої події</span>
            <span class="row__sub">Події, де ви організатор або сканер</span>
          </span>
          <ion-icon class="row__chev" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
        </button>

    <!-- Preferences/cities залишені як є -->
    <form [formGroup]="form" class="profile-form">
    <div class="card">
      <div class="card__head">
        <h2 class="card__title">Підписки на міста</h2>
        <div class="card__hint">Оберіть кілька міст, щоб отримувати релевантні події.</div>
      </div>

      <app-searchable-dropdown
        class="select-item"
        label="Міста"
        placeholder="Оберіть міста"
        searchPlaceholder="Пошук міста..."
        [options]="availableCities"
        [value]="form.controls.subscribedCities.value"
        [multiple]="true"
        [showEmptyOption]="true"
        emptyLabel="Очистити вибір"
        (valueChange)="onCitiesSelectionChange($event)"
      ></app-searchable-dropdown>

      <div class="chips" *ngIf="form.controls.subscribedCities.value?.length">
        <ion-chip class="chip" *ngFor="let c of form.controls.subscribedCities.value" color="success" outline="true">
          <ion-label>{{ c }}</ion-label>
        </ion-chip>
      </div>
    </div>

    <div class="card">
      <div class="card__head">
        <h2 class="card__title">Інтереси</h2>
        <ion-button fill="clear" class="add" (click)="addInterest()" aria-label="Додати інтерес">
          <ion-icon slot="icon-only" name="add-circle-outline"></ion-icon>
        </ion-button>
      </div>

      <div class="chips">
        <ion-chip
          class="chip chip--clickable"
          *ngFor="let t of form.controls.interests.value"
          color="success"
          outline="true"
          (click)="removeInterest(t)"
        >
          <ion-label>{{ t }}</ion-label>
        </ion-chip>
      </div>
      <div class="helper">Натисніть на інтерес, щоб видалити.</div>
    </div>
    </form>

    <button type="button" class="logout-full" (click)="logout()">
      <ion-icon name="log-out-outline" aria-hidden="true"></ion-icon>
      Вийти
    </button>

    <div class="version">EventHub v1.0.0</div>
    </div>
  </div>
</ion-content>
