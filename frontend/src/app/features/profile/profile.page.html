<ion-header>
  <ion-toolbar>
    <ion-title>Профіль</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Дані користувача</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-label>
            <h3>Електронна пошта</h3>
            <p>{{ user?.email || '—' }}</p>
          </ion-label>
        </ion-item>
        <ion-item>
          <ion-label>
            <h3>Ім’я</h3>
            <p>{{ user?.full_name || '—' }}</p>
          </ion-label>
        </ion-item>
        <ion-item>
          <ion-label>
            <h3>Статус</h3>
            <p>{{ user?.status || '—' }}</p>
          </ion-label>
        </ion-item>
        <ion-item>
          <ion-label>
            <h3>Активний</h3>
            <p>{{ user?.is_active ? 'Так' : 'Ні' }}</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

  <!-- Floating action button above tab bar to ensure clickability -->
  <ion-fab slot="fixed" vertical="bottom" horizontal="center">
    <ion-fab-button color="danger" (click)="logout()" type="button">
      <ion-icon name="log-out-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
