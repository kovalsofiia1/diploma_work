<ion-header>
  <ion-toolbar>
    <ion-title>Профіль</ion-title>
    <ion-buttons slot="end">
      <ion-button color="danger" (click)="logout()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding" (click)="onAnyClick($event)">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Дані користувача</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-label>
            <h3>Електронна пошта</h3>
            <p>{{ user?.email || '—' }}</p>
          </ion-label>
        </ion-item>
        <ion-item>
          <ion-label>
            <h3>Ім’я</h3>
            <p>{{ user?.full_name || '—' }}</p>
          </ion-label>
        </ion-item>
        <ion-item>
          <ion-label>
            <h3>Статус</h3>
            <p>{{ user?.status || '—' }}</p>
          </ion-label>
        </ion-item>
        <ion-item>
          <ion-label>
            <h3>Активний</h3>
            <p>{{ user?.is_active ? 'Так' : 'Ні' }}</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

  <!-- Debug: plain HTML button to verify click binding -->
  <div style="margin-top: 16px; text-align:center">
    <button (click)="logout()">Вийти (debug)</button>
  </div>

</ion-content>
