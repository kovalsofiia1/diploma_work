<ion-header>
  <ion-toolbar>
    <ion-title>Events</ion-title>
  </ion-toolbar>
  </ion-header>

<ion-content>
  <ion-list>
    <ion-card *ngFor="let item of items" class="ion-margin">
      <img [src]="item.image" alt="" />
      <ion-card-header>
        <ion-card-title>{{ item.title }}</ion-card-title>
        <ion-card-subtitle>{{ item.city }} · {{ item.date }}</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <ion-button routerLink="/booking" color="primary">Book</ion-button>
      </ion-card-content>
    </ion-card>
  </ion-list>
</ion-content>
