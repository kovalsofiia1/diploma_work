<app-header></app-header>

<ion-content [fullscreen]="true" class="events">
  <div class="container">
    <div class="explore-head">
      <h1 class="explore-head__title">Огляд</h1>

      <div class="explore-tools" aria-label="Пошук і фільтри">
        <ion-searchbar
          class="explore-search"
          mode="ios"
          placeholder="Пошук за назвою або локацією…"
          [debounce]="150"
          [(ngModel)]="query"
        ></ion-searchbar>

        <button
          type="button"
          class="filter-btn"
          [class.filter-btn--active]="showSavedOnly"
          (click)="toggleSavedOnly()"
          [attr.aria-pressed]="showSavedOnly"
          aria-label="Фільтр: збережені"
        >
          <ion-icon [name]="showSavedOnly ? 'heart-outline' : 'options-outline'"></ion-icon>
        </button>
      </div>
    </div>

    <div class="results">
      Знайдено: <b>{{ visibleEvents.length }}</b> подій
    </div>

    <app-events-list [popularEvents]="visibleEvents"></app-events-list>
  </div>
</ion-content>
