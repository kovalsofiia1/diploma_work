server {
    listen       ${PORT};
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # 127.0.0.11 = Docker's embedded DNS (used for `backend` hostname in
    # docker-compose). 8.8.8.8 / 1.1.1.1 are fallbacks for public hostnames
    # like the Render backend URL.
    resolver 127.0.0.11 8.8.8.8 1.1.1.1 valid=30s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy "/api" and "/api/<anything>" to the backend, stripping the /api prefix.
    # We use a regex capture + explicit URI on proxy_pass because nginx ignores
    # `rewrite ... break` when proxy_pass contains a variable.
    location ~ ^/api(/.*)?$ {
        set $backend_path $1;
        if ($backend_path = "") {
            set $backend_path "/";
        }
        proxy_pass         ${BACKEND_URL}$backend_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header   Host              $proxy_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }
}
