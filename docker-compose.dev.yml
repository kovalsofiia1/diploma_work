services:
  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot-reload
      - ./backend/app:/app/app:ro
      - ./backend/alembic:/app/alembic:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - WATCHFILES_FORCE_POLLING=true

  parser-service:
    build:
      context: ./parser-service
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    ports:
      - "8001:8001"
    volumes:
      # Mount source code for hot-reload
      - ./parser-service/app:/app/app:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - WATCHFILES_FORCE_POLLING=true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"  # Angular dev server port
      - "80:80"      # Keep production port for compatibility
    volumes:
      # Mount source code for hot-reload
      - ./frontend/src:/app/src:ro
      - ./frontend/angular.json:/app/angular.json:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json:ro
      - ./frontend/package.json:/app/package.json:ro
      - ./frontend/proxy.conf.docker.json:/app/proxy.conf.docker.json:ro
      # Preserve node_modules in container
      - frontend_node_modules:/app/node_modules
    command: npm run start -- --host 0.0.0.0 --poll 2000 --proxy-config proxy.conf.docker.json
    depends_on:
      - backend
      - parser-service
    environment:
      - NODE_ENV=development

volumes:
  postgres_data:
  frontend_node_modules:
