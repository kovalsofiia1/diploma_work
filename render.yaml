# 1. Окремий блок для вбудованої бази даних
databases:
  - name: diploma-db
    plan: free
    databaseName: feellikeevent_db
    user: sofia_admin

# 2. Блок для ваших Docker-сервісів
services:
  # Бекенд (FastAPI)
  - type: web
    name: diploma-backend
    plan: free
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: diploma-db
          property: connectionString

  # Парсер сервіс (Закритий внутрішній сервіс)
  - type: private
    name: diploma-parser
    plan: free
    runtime: docker
    dockerContext: ./parser-service
    dockerfilePath: ./parser-service/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: diploma-db
          property: connectionString

  # Фронтенд (Angular / Ionic)
  - type: web
    name: feellikeevent
    plan: free
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: diploma-backend
          property: host